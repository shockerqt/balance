name: Verify Balance Native Daily Log

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/balance-domain/**"
      - ".github/workflows/mobile-native-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --prefix apps/mobile
      - name: Generate Android project and resolve local module
        working-directory: apps/mobile
        run: APP_VARIANT=development npx expo prebuild --platform android --no-install
      - name: Compile Compose screen and test native calendar arithmetic
        working-directory: apps/mobile/android
        run: ./gradlew :balance-daily-log:compileDebugKotlin :balance-daily-log:testDebugUnitTest --no-daemon -PreactNativeArchitectures=arm64-v8a
