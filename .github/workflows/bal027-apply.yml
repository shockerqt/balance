name: BAL-027 implementation helper

on:
  push:
    branches:
      - task/BAL-027-canonical-units-portions
    paths:
      - scripts/bal027_apply.py
      - .github/workflows/bal027-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/BAL-027-canonical-units-portions
      - name: Apply canonical units implementation
        run: python scripts/bal027_apply.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit implementation
        run: |
          git config user.name "balance-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- apps/server apps/mobile apps/dashboard
          git diff --cached --check
          git commit -m "feat: model canonical units and portions"
          git push origin HEAD:task/BAL-027-canonical-units-portions
