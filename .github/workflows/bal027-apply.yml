name: BAL-027 implementation helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'task/BAL-027-canonical-units-portions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/BAL-027-canonical-units-portions
      - name: Apply canonical units implementation
        run: python scripts/bal027_runner.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit implementation
        run: |
          git config user.name "balance-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- apps/server apps/mobile apps/dashboard
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "feat: model canonical units and portions"
          git push origin HEAD:task/BAL-027-canonical-units-portions
