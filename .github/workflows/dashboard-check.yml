name: Verify Balance Dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "apps/mobile/**"
      - "scripts/bal027-review-fixes.py"
      - ".github/workflows/dashboard-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-dashboard:
    name: Test, typecheck and build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/BAL-027-canonical-units-portions
          fetch-depth: 2

      - name: Apply BAL-027 review fixes
        run: python scripts/bal027-review-fixes.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify dashboard
        run: |
          npm ci --prefix apps/dashboard
          npm test --prefix apps/dashboard
          npm run build --prefix apps/dashboard

      - name: Verify mobile
        run: |
          npm ci --prefix apps/mobile
          cd apps/mobile
          npx tsc --noEmit
          npm run test:food-library
          npm run test:macrofactor
          npm run test:nutrition

      - name: Publish fixes and restore workflow
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/dashboard-check.yml > .github/workflows/dashboard-check.yml
          rm -f .github/workflows/bal027-review-fixes.yml scripts/bal027-review-fixes.py
          git config user.name "balance-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- apps/dashboard/src/features/food-log/commands/execute-command.ts apps/dashboard/src/features/food-log/components/food-log/food-log.tsx apps/dashboard/tests/execute-command.test.ts apps/mobile/src/lib/food-library-documents.ts apps/mobile/src/lib/food-portions.ts apps/mobile/src/hooks/use-food-library-store.tsx apps/mobile/src/hooks/use-meal-store.tsx apps/mobile/tests/food-library-documents.test.mjs .github/workflows/dashboard-check.yml .github/workflows/bal027-review-fixes.yml scripts/bal027-review-fixes.py
          git diff --cached --check
          git commit -m "fix: preserve named portion semantics during edits"
          git push origin HEAD:task/BAL-027-canonical-units-portions
