name: Verify Balance Dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-dashboard:
    name: Finalize BAL-027
    if: github.head_ref == 'task/BAL-027-canonical-units-portions'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/BAL-027-canonical-units-portions
          fetch-depth: 0

      - name: Apply final MCP contract fix
        run: python scripts/bal027_patch_existing_server_post.py

      - name: Check server
        run: |
          cargo fmt --all
          cargo check -p server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check dashboard
        run: |
          npm ci --prefix apps/dashboard
          npm test --prefix apps/dashboard
          npm run build --prefix apps/dashboard

      - name: Check mobile
        run: |
          npm ci --prefix apps/mobile
          cd apps/mobile
          npx tsc --noEmit
          npm run test:food-library
          npm run test:macrofactor

      - name: Remove implementation helpers and publish final diff
        run: |
          git config user.name "balance-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/dashboard-check.yml
          git rm -f --ignore-unmatch -- \
            .github/workflows/bal027-apply.yml \
            scripts/bal027_apply.py \
            scripts/bal027_runner.py \
            scripts/bal027_patch_dashboard.py \
            scripts/bal027_patch_existing_server_post.py \
            scripts/bal027_patch_mobile.py \
            scripts/bal027_patch_mobile_post.py \
            scripts/bal027_patch_mobile_test_fix.py \
            scripts/bal027_patch_server.py \
            scripts/bal027_patch_server_consumers.py \
            scripts/bal027_patch_server_fixups.py \
            scripts/bal027_patch_server_postfix.py \
            scripts/bal027_payload_00.txt \
            scripts/bal027_payload_01.txt \
            scripts/bal027_payload_02.txt \
            scripts/bal027_payload_02a.txt \
            scripts/bal027_payload_02b.txt \
            scripts/bal027_payload_03.txt \
            scripts/bal027_payload_04.txt
          git add -- apps/server/src/modules/mcp/mod.rs .github/workflows/dashboard-check.yml
          git diff --cached --check
          git status --short
          git commit -m "feat: finalize canonical units and portions"
          git push origin HEAD:task/BAL-027-canonical-units-portions
