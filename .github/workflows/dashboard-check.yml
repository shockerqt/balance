name: Verify Balance Dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "packages/balance-domain/**"
      - ".github/workflows/**"
      - "scripts/delivery/**"
      - "delivery/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dashboard:
    name: Test, typecheck and build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix apps/dashboard

      - name: Test shared domain package
        run: npm --prefix packages/balance-domain test

      - name: Run dashboard command tests
        working-directory: apps/dashboard
        run: npm test

      - name: Typecheck and build dashboard
        working-directory: apps/dashboard
        run: npm run build -- --base /releases/${{ github.event.pull_request.head.sha || github.sha }}/

      - name: Package exact validated dashboard
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/delivery/package-dashboard.py

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dashboard.tar.gz
            dashboard.sha256
          retention-days: 30
          if-no-files-found: error
