name: BAL-027 refresh schema artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'task/BAL-027-canonical-units-portions'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: balance_sqlx
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d balance_sqlx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/balance_sqlx
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/BAL-027-canonical-units-portions

      - name: Migrate remaining V1 server test fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          sync_path = Path('apps/server/src/connectors/sync.rs')
          text = sync_path.read_text()
          replacements = [
              (
                  "            base_amount: 100.0,\n            unit: FoodUnit::G,\n            nutrition: NutritionValues {",
                  "            canonical_unit: CanonicalUnit::G,\n            nutrition_per100: NutritionValues {",
              ),
              (
                  "            serving_label: None,\n            grams_per_unit: None,\n            chilean_seals: vec![],",
                  "            portions: vec![],\n            chilean_seals: vec![],",
              ),
              (
                  "            .create_consumption(1, log_id, food_id, 150.0, FoodUnit::G, consumed_at)",
                  "            .create_consumption(1, log_id, food_id, 150.0, None, consumed_at)",
              ),
              (
                  "                        quantity: 200.0,\n                        consumed_at: consumed_at + 60_000,",
                  "                        canonical_quantity: 200.0,\n                        entry: MealLogEntry {\n                            entered_quantity: 200.0,\n                            portion_snapshot: None,\n                        },\n                        consumed_at: consumed_at + 60_000,",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one sync fixture marker, found {count}: {old[:60]!r}')
              text = text.replace(old, new, 1)
          sync_path.write_text(text)

          mcp_path = Path('apps/server/src/modules/mcp/mod.rs')
          text = mcp_path.read_text()
          old = '"description": "Crea un alimento personal con nutrición siempre expresada por 100 g o 100 ml. Las porciones nombradas son conversiones opcionales y explícitas.",'
          new = '"description": "Crea un alimento personal con nutrición siempre expresada por 100 g o 100 ml. Las porciones nombradas son conversiones opcionales y explícitas. Úsala solo después de confirmar con el usuario cualquier dato ambiguo.",'
          if text.count(old) != 1:
              raise SystemExit('create_food description marker not found exactly once')
          mcp_path.write_text(text.replace(old, new, 1))

          ws_path = Path('apps/server/src/modules/sync/ws.rs')
          text = ws_path.read_text()
          old_template = '''            "details": {
                "schemaVersion": 1,
                "baseAmount": 100.0,
                "unit": "g",
                "nutrition": {
                    "calories": 52.0,
                    "protein": 0.3,
                    "carbs": 14.0,
                    "fat": 0.2,
                    "fiber": 2.4
                }
            },'''
          new_template = '''            "details": {
                "schemaVersion": 2,
                "canonicalUnit": "g",
                "nutritionPer100": {
                    "calories": 52.0,
                    "protein": 0.3,
                    "carbs": 14.0,
                    "fat": 0.2,
                    "fiber": 2.4
                },
                "portions": []
            },'''
          old_log = '''            "nutritionSnapshot": {
                "schemaVersion": 1,
                "baseAmount": 100.0,
                "unit": "g",
                "nutrition": {
                    "calories": 52.0,
                    "protein": 0.3,
                    "carbs": 14.0,
                    "fat": 0.2
                }
            },
            "quantity": 150.0,'''
          new_log = '''            "nutritionSnapshot": {
                "schemaVersion": 2,
                "canonicalUnit": "g",
                "nutritionPer100": {
                    "calories": 52.0,
                    "protein": 0.3,
                    "carbs": 14.0,
                    "fat": 0.2
                }
            },
            "canonicalQuantity": 150.0,
            "entry": { "enteredQuantity": 150.0 },'''
          invalid_old = '        template["details"]["baseAmount"] = json!(0);'
          invalid_new = '        template["details"]["nutritionPer100"]["calories"] = json!(-1);'
          for old, new, label in [
              (old_template, new_template, 'valid template'),
              (old_log, new_log, 'valid log'),
              (invalid_old, invalid_new, 'invalid template assertion'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} marker not found exactly once')
              text = text.replace(old, new, 1)
          ws_path.write_text(text)
          PY
          cargo fmt --all

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLx CLI
        run: >-
          cargo install sqlx-cli --version 0.8.6 --locked
          --no-default-features --features postgres,rustls

      - name: Apply migrations
        run: cargo sqlx migrate run --source apps/server/migrations

      - name: Refresh schema snapshot
        run: scripts/render-schema-snapshot.sh docs/generated/database-schema.md

      - name: Seed integration identity
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file scripts/seed-test-user.sql

      - name: Refresh SQLx metadata
        run: cargo sqlx prepare --workspace -- --all-targets

      - name: Verify server
        env:
          BALANCE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/balance_sqlx
          SQLX_OFFLINE: 'true'
        run: cargo test -p server --all-targets

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify dashboard
        run: |
          npm ci --prefix apps/dashboard
          npm test --prefix apps/dashboard
          npm run build --prefix apps/dashboard

      - name: Verify mobile
        run: |
          npm ci --prefix apps/mobile
          cd apps/mobile
          npx tsc --noEmit
          npm run test:food-library
          npm run test:macrofactor

      - name: Publish generated artifacts and remove helper
        run: |
          rm .github/workflows/bal027-refresh-schema.yml
          git config user.name "balance-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- apps/server/src/connectors/sync.rs apps/server/src/modules/mcp/mod.rs apps/server/src/modules/sync/ws.rs docs/generated/database-schema.md .sqlx .github/workflows/bal027-refresh-schema.yml
          git diff --cached --check
          git commit -m "chore: refresh BAL-027 generated schema artifacts"
          git push origin HEAD:task/BAL-027-canonical-units-portions
