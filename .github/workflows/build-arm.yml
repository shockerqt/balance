name: Build & Deploy Balance API for ARM (OCI)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'scripts/sqlx-test-schema.sql'
      - 'scripts/ensure-lax-sync-schema.sql'
      - 'scripts/ensure-macrofactor-import-schema.sql'
      - 'scripts/ensure-weight-tracking-schema.sql'
      - '.sqlx/**'
      - 'Cargo.toml'
      - '.github/workflows/build-arm.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'scripts/sqlx-test-schema.sql'
      - 'scripts/ensure-lax-sync-schema.sql'
      - 'scripts/ensure-macrofactor-import-schema.sql'
      - 'scripts/ensure-weight-tracking-schema.sql'
      - '.sqlx/**'
      - 'Cargo.toml'
      - '.github/workflows/build-arm.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the already-verified ARM artifact after production approval'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sqlx-metadata:
    name: Verify SQLx metadata
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: balance_sqlx
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d balance_sqlx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/balance_sqlx
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLx CLI
        run: >-
          cargo install sqlx-cli --version 0.8.6 --locked
          --no-default-features --features postgres,rustls

      - name: Load the reproducible SQLx CI schema
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file scripts/sqlx-test-schema.sql

      - name: Regenerate SQLx metadata from the ephemeral database
        run: cargo sqlx prepare --workspace -- --all-targets

      - name: Fail when SQLx metadata is stale
        run: |
          git diff --exit-code -- .sqlx
          test -z "$(git ls-files --others --exclude-standard .sqlx)"

  build-arm:
    name: Compile Balance API (ARM64)
    needs: sqlx-metadata
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross prebuilt
        uses: taiki-e/install-action@cross

      - name: Build server with cross for ARM64
        run: cross build --target=aarch64-unknown-linux-gnu --release --manifest-path apps/server/Cargo.toml

      - name: Upload server binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-server-arm
          path: target/aarch64-unknown-linux-gnu/release/server
          if-no-files-found: error

  deploy:
    name: Deploy verified binary to OCI VPS
    needs: build-arm
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download compiled server binary
        uses: actions/download-artifact@v4
        with:
          name: binary-server-arm
          path: ./deploy

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Stage and roll out the verified binary
        run: |
          scp ./deploy/server ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/balance-server.candidate
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '
            set -eu
            sudo install -m 755 /home/${{ secrets.SERVER_USER }}/balance-server.candidate /opt/balance-server.candidate
            sudo cp --archive /opt/balance-server /opt/balance-server.previous
            sudo mv /opt/balance-server.candidate /opt/balance-server
            if ! sudo systemctl restart balance-server; then
              sudo mv /opt/balance-server.previous /opt/balance-server
              sudo systemctl restart balance-server || true
              exit 1
            fi
          '

      - name: Healthcheck and rollback on failure
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '
            if ! curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/docs >/dev/null; then
              sudo mv /opt/balance-server.previous /opt/balance-server
              sudo systemctl restart balance-server
              exit 1
            fi
            sudo rm -f /opt/balance-server.previous
          '
