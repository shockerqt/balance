name: Build & Deploy Rust Server for ARM (OCI)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
  workflow_dispatch:

jobs:
  build-arm:
    name: Compile Rust Server (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross prebuilt
        uses: taiki-e/install-action@cross

      - name: Build with cross for ARM64
        run: cross build --target=aarch64-unknown-linux-gnu --release --manifest-path apps/server/Cargo.toml

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-arm
          path: apps/server/target/aarch64-unknown-linux-gnu/release/server

  deploy:
    name: Deploy Binary to OCI VPS
    needs: build-arm
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: binary-arm
          path: ./deploy

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Upload binary to server
        run: scp ./deploy/server ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/balance-server

      - name: Update binary in /opt & restart systemd service
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "sudo systemctl stop balance-server || true && sudo mv /home/${{ secrets.SERVER_USER }}/balance-server /opt/balance-server && sudo chmod +x /opt/balance-server && sudo systemctl start balance-server"
