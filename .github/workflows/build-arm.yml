name: Build & Deploy Balance API for ARM (OCI)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'scripts/seed-test-user.sql'
      - 'scripts/schema-catalog.sql'
      - 'scripts/schema-fingerprint.sh'
      - 'scripts/render-schema-snapshot.sh'
      - 'scripts/generate-schema-snapshot.sh'
      - 'scripts/verify-schema-fingerprint.sh'
      - 'docs/database-migrations.md'
      - 'docs/generated/database-schema.md'
      - 'Makefile'
      - '.sqlx/**'
      - 'Cargo.toml'
      - '.github/workflows/build-arm.yml'
      - 'scripts/delivery/package-api.py'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'scripts/seed-test-user.sql'
      - 'scripts/schema-catalog.sql'
      - 'scripts/schema-fingerprint.sh'
      - 'scripts/render-schema-snapshot.sh'
      - 'scripts/generate-schema-snapshot.sh'
      - 'scripts/verify-schema-fingerprint.sh'
      - 'docs/database-migrations.md'
      - 'docs/generated/database-schema.md'
      - 'Makefile'
      - '.sqlx/**'
      - 'Cargo.toml'
      - '.github/workflows/build-arm.yml'
      - 'scripts/delivery/package-api.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlx-metadata:
    name: Verify SQLx metadata
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: balance_sqlx
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d balance_sqlx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/balance_sqlx
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLx CLI
        run: >-
          cargo install sqlx-cli --version 0.8.6 --locked
          --no-default-features --features postgres,rustls

      - name: Run the active SQLx migration chain
        run: cargo sqlx migrate run --source apps/server/migrations

      - name: Verify the generated schema snapshot
        run: |
          scripts/render-schema-snapshot.sh "$RUNNER_TEMP/database-schema.md"
          diff --unified docs/generated/database-schema.md "$RUNNER_TEMP/database-schema.md"

      - name: Seed the controlled integration-test identity
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file scripts/seed-test-user.sql

      - name: Regenerate SQLx metadata from the ephemeral database
        run: cargo sqlx prepare --workspace -- --all-targets

      - name: Fail when SQLx metadata is stale
        run: |
          git diff --exit-code -- .sqlx
          test -z "$(git ls-files --others --exclude-standard .sqlx)"

      - name: Run server tests against PostgreSQL
        env:
          BALANCE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/balance_sqlx
          SQLX_OFFLINE: 'true'
        run: cargo test -p server --all-targets

  build-arm:
    name: Compile Balance API (ARM64)
    needs: sqlx-metadata
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install cross prebuilt
        uses: taiki-e/install-action@cross

      - name: Build server with cross for ARM64
        run: cross build --target=aarch64-unknown-linux-gnu --release --manifest-path apps/server/Cargo.toml

      - name: Package source-bound API artifact
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/delivery/package-api.py

      - name: Upload validated API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            api.tar.gz
            api.sha256
          retention-days: 30
          if-no-files-found: error
