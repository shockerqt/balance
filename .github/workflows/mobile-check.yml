name: Verify Balance Mobile

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/balance-domain/**"
      - ".github/workflows/**"
      - "scripts/delivery/**"
      - "delivery/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mobile:
    name: Typecheck and resolve Daily configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Test shared domain package
        run: npm --prefix packages/balance-domain test

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Test shared domain mobile consumer
        working-directory: apps/mobile
        run: npm run test:domain

      - name: Test weight state and precision
        working-directory: apps/mobile
        run: npm run test:weight

      - name: Test authentication session state
        working-directory: apps/mobile
        run: npm run test:auth

      - name: Test food library document state
        working-directory: apps/mobile
        run: npm run test:food-library

      - name: Test MacroFactor import planning
        working-directory: apps/mobile
        run: npm run test:macrofactor

      - name: Test nutrition scaling and presentation precision
        working-directory: apps/mobile
        run: npm run test:nutrition

      - name: Resolve Daily Expo configuration
        working-directory: apps/mobile
        run: APP_VARIANT=daily npx expo config --type public

      - name: Verify Android Metro export
        working-directory: apps/mobile
        run: APP_VARIANT=daily npx expo export --platform android --output-dir /tmp/balance-mobile-domain-export
